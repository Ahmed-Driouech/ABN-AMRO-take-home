[project]
name = "annual-report-rag"
version = "0.1.0"
description = "RAG over company annual reports (PDF) — ABN AMRO take-home"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "chromadb>=0.5.20",
    "rank-bm25>=0.2.2",
    "openai>=1.60",
    "tiktoken>=0.8",
    "unstructured-client>=0.46.2",
    "langchain-unstructured>=1.0.1",
    "pandas>=3.0.5",
    "tabulate>=0.10.0",
    "lxml>=6.1.2",
    "html5lib>=1.1",
    "beautifulsoup4>=4.15.0",
    "pypdf>=6.16.2",
    "langchain-text-splitters>=1.1.2",
    "langchain-openai>=1.6.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pdfplumber>=0.11.4",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "pymupdf>=1.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
